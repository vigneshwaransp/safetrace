[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safetrace-backend"
version = "0.1.0"
description = "SafeTrace: Non-Consensual Image Abuse Prevention & Evidence Tracking Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "imagehash>=4.3.1",
    "pdqhash>=0.2.8",
    "opencv-python-headless>=4.10.0",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "passlib>=1.7.4",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

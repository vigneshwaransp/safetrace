services:
  - type: web
    name: safetrace-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      - key: DATABASE_URL
        value: sqlite:////app/storage/safetrace.db
      - key: STORAGE_DIR
        value: /app/storage
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:3000,https://safetrace-frontend.vercel.app,https://safetrace-frontend-vigneshwaranspcs24-4100s-projects.vercel.app"
